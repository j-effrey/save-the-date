<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date — Jeffrey &amp; Victoria</title>
  <style>
    /* ── Tokens — Atelier × Garden ─────────────────
         Cormorant Garamond · warm cream card
         sage green ornaments & ghost button
         rose pink ampersand · amber label
    ─────────────────────────────────────────────── */
    /* ── Bouquet palette ─────────────────────────────
         Apricot dahlias · white cosmos · blush roses
         Fresh green tendrils · soft grey-white wall
    ─────────────────────────────────────────────── */
    :root {
      --page-bg:        #F5EAD7;
      --card-bg:        #FFFFFC;
      --text-primary:   #2c1e14;
      --text-secondary: #7a6050;
      --text-muted:     #a89080;
      --amber:          #E09384;
      --amber-dim:      rgba(224, 147, 132, 0.10);
      --rose:           #F5AA71;
      --peach:          #edd4b0;
      --photo-fill:     #ede8e0;
      --divider:        rgba(44, 30, 20, 0.08);
      --cal-border:     rgba(44, 30, 20, 0.11);
      --shadow:         0 20px 60px rgba(224, 147, 132, 0.09), 0 2px 12px rgba(224, 147, 132, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg:        #1e1810;
        --card-bg:        #181208;
        --text-primary:   #f4f0e8;
        --text-secondary: #c8b090;
        --text-muted:     #806858;
        --photo-fill:     #2a2010;
        --divider:        rgba(244, 240, 232, 0.09);
        --cal-border:     rgba(244, 240, 232, 0.13);
        --shadow:         0 24px 72px rgba(0,0,0,0.52), 0 2px 12px rgba(0,0,0,0.28);
      }
    }

    :root[data-theme="dark"] {
      --page-bg:        #1e1810;
      --card-bg:        #181208;
      --text-primary:   #f4f0e8;
      --text-secondary: #c8b090;
      --text-muted:     #806858;
      --photo-fill:     #2a2010;
      --divider:        rgba(244, 240, 232, 0.09);
      --cal-border:     rgba(244, 240, 232, 0.13);
      --shadow:         0 24px 72px rgba(0,0,0,0.52), 0 2px 12px rgba(0,0,0,0.28);
    }

    :root[data-theme="light"] {
      --page-bg:        #F5EAD7;
      --card-bg:        #FFFFFC;
      --text-primary:   #2c1e14;
      --text-secondary: #7a6050;
      --text-muted:     #a89080;
      --photo-fill:     #ede8e0;
      --divider:        rgba(44, 30, 20, 0.08);
      --cal-border:     rgba(44, 30, 20, 0.11);
      --shadow:         0 20px 60px rgba(224, 147, 132, 0.09), 0 2px 12px rgba(224, 147, 132, 0.05);
    }

    /* ── Reset ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 20px;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
    }

    /* ── Card ────────────────────────────────────── */
    .card {
      background: var(--card-bg);
      max-width: 560px;
      width: 100%;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    /* ── Photo Slot ──────────────────────────────── */
    .photo-slot {
      width: 100%;
      background: var(--photo-fill);
      overflow: hidden;
      line-height: 0;
    }

    .photo-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Body ────────────────────────────────────── */
    .body {
      padding: 46px 52px 50px;
      text-align: center;
    }

    /* Ornamental rule — sage gradient lines */
    .ornament {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .ornament::before,
    .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--amber));
      opacity: 0.28;
    }

    .ornament::after {
      background: linear-gradient(to left, transparent, var(--amber));
    }

    .ornament-glyph {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", "Segoe UI Symbol", "Apple Color Emoji", serif;
      color: var(--amber);
      font-size: 11px;
      opacity: 0.55;
      letter-spacing: 0.30em;
    }

    /* Names */
    .names {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-weight: 400;
      font-size: clamp(26px, 6vw, 36px);
      color: var(--text-primary);
      letter-spacing: 0.04em;
      line-height: 1.12;
      text-wrap: balance;
      margin-bottom: 4px;
    }

    .ampersand {
      color: var(--rose);
      font-style: italic;
    }

    /* Divider */
    .rule {
      width: 36px;
      height: 1px;
      background: var(--amber);
      opacity: 0.30;
      margin: 18px auto;
    }

    /* Save the date block */
    .save-label {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .date-line {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-weight: 300;
      font-size: clamp(16px, 3.8vw, 20px);
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .date-line strong {
      display: block;
      font-style: normal;
      font-weight: 400;
      font-size: 1.05em;
      color: var(--text-primary);
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .date-sep {
      display: block;
      font-style: normal;
      font-family: "Segoe UI Symbol", "Apple Color Emoji", serif;
      color: var(--rose);
      font-size: 15px;
      line-height: 2;
      opacity: 0.65;
    }

    /* Primary CTA — filled amber */
    .btn-primary {
      display: inline-block;
      background: var(--amber);
      color: #fff;
      border: none;
      text-decoration: none;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 12px 30px;
      border-radius: 1px;
      margin-bottom: 18px;
      transition: opacity 0.18s;
    }

    .btn-primary:hover {
      opacity: 0.82;
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    /* Calendar section */
    .cal-label {
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-style: italic;
      font-size: 10.5px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .cal-btns {
      display: flex;
      gap: 7px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-cal {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--cal-border);
      background: transparent;
      color: var(--text-secondary);
      text-decoration: none;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .btn-cal:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-dim);
    }

    .btn-cal:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .btn-cal svg { flex-shrink: 0; }

    /* Footer */
    .footer {
      margin-top: 34px;
      padding-top: 24px;
      border-top: 1px solid var(--divider);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-style: italic;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      line-height: 1.80;
    }

    @media (max-width: 460px) {
      .body { padding: 34px 26px 38px; }
      .cal-btns { flex-direction: column; align-items: center; }
      .btn-cal { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<article class="card">

  <!-- ── Photo ────────────────────────────────────────
       To swap in a real photo, replace the <div class="photo-placeholder">
       block with: <img src="your-photo.jpg" alt="Jeffrey and Victoria">
  ─────────────────────────────────────────────────── -->
  <div class="photo-slot">
    <img src="engagement.JPG" alt="Jeffrey and Victoria at Bethesda Terrace">
  </div>

  <!-- ── Body ──────────────────────────────────────── -->
  <div class="body">

    <div class="ornament">
      <span class="ornament-glyph">✦ ✦ ✦</span>
    </div>

    <h1 class="names">
      Jeffrey <span class="ampersand">&amp;</span> Victoria
    </h1>

    <div class="rule"></div>

    <p class="save-label">Save the Date</p>
    <p class="date-line">
      We're getting married!
      <span class="date-sep">✦</span>
      <strong>Sunday, July 25th, 2027</strong>
    </p>

    <a href="https://j-effrey.github.io/save-the-date/" target="_blank" rel="noopener" class="btn-primary">Click here to open!</a>

    <p class="footer">
      Formal invitation and more details to follow.
    </p>

    <p class="cal-label">Add to your calendar</p>
    <div class="cal-btns">

      <a id="btn-gcal" href="#" class="btn-cal" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.5 3h-1V1.5A.5.5 0 0 0 18 1h-1a.5.5 0 0 0-.5.5V3h-9V1.5A.5.5 0 0 0 7 1H6a.5.5 0 0 0-.5.5V3h-1A2.5 2.5 0 0 0 2 5.5v14A2.5 2.5 0 0 0 4.5 22h15a2.5 2.5 0 0 0 2.5-2.5v-14A2.5 2.5 0 0 0 19.5 3zM20 19.5a.5.5 0 0 1-.5.5h-15a.5.5 0 0 1-.5-.5V9h16v10.5zM4 7.5V7a.5.5 0 0 1 .5-.5h15a.5.5 0 0 1 .5.5v.5H4z"/>
          <rect x="7" y="12" width="2" height="2" rx="0.5"/>
          <rect x="11" y="12" width="2" height="2" rx="0.5"/>
          <rect x="15" y="12" width="2" height="2" rx="0.5"/>
          <rect x="7" y="16" width="2" height="2" rx="0.5"/>
          <rect x="11" y="16" width="2" height="2" rx="0.5"/>
        </svg>
        Google Calendar
      </a>

      <a id="btn-outlook" href="#" class="btn-cal" target="_blank" rel="noopener">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 4H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zM3 6h18v2H3V6zm0 13V10h18v9H3z"/>
          <rect x="6" y="13" width="2.5" height="2" rx="0.4"/>
          <rect x="10.75" y="13" width="2.5" height="2" rx="0.4"/>
          <rect x="15.5" y="13" width="2.5" height="2" rx="0.4"/>
          <rect x="6" y="16.5" width="2.5" height="2" rx="0.4"/>
          <rect x="10.75" y="16.5" width="2.5" height="2" rx="0.4"/>
        </svg>
        Outlook
      </a>

      <a id="btn-apple" href="#" class="btn-cal" download="jeffrey-victoria-wedding.ics">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3h-1V2a1 1 0 0 0-2 0v1H8V2a1 1 0 0 0-2 0v1H5a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3zm1 17a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9h16v11zm0-13H4V6a1 1 0 0 1 1-1h1v1a1 1 0 0 0 2 0V5h8v1a1 1 0 0 0 2 0V5h1a1 1 0 0 1 1 1v1z"/>
          <rect x="7" y="12" width="2" height="2" rx="0.4"/>
          <rect x="11" y="12" width="2" height="2" rx="0.4"/>
          <rect x="15" y="12" width="2" height="2" rx="0.4"/>
          <rect x="7" y="16" width="2" height="2" rx="0.4"/>
          <rect x="11" y="16" width="2" height="2" rx="0.4"/>
        </svg>
        Apple Calendar
      </a>

    </div>

  </div>
</article>

<script>
  // Google Calendar
  (function () {
    var url = new URL('https://calendar.google.com/calendar/render');
    url.searchParams.set('action', 'TEMPLATE');
    url.searchParams.set('text', "Jeffrey & Victoria's Wedding");
    url.searchParams.set('dates', '20270725T120000Z/20270726T000000Z');
    url.searchParams.set('details', "Save the Date! Jeffrey & Victoria are getting married. More details to follow.");
    document.getElementById('btn-gcal').href = url.toString();
  })();

  // Outlook Web
  (function () {
    var url = new URL('https://outlook.live.com/calendar/0/deeplink/compose');
    url.searchParams.set('subject', "Jeffrey & Victoria's Wedding");
    url.searchParams.set('startdt', '2027-07-25T12:00:00');
    url.searchParams.set('enddt',   '2027-07-26T00:00:00');
    url.searchParams.set('body',    "Save the Date! Jeffrey & Victoria are getting married. More details to follow.");
    url.searchParams.set('path',    '/calendar/action/compose');
    url.searchParams.set('rru',     'addevent');
    document.getElementById('btn-outlook').href = url.toString();
  })();

  // Apple Calendar / ICS download
  (function () {
    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Jeffrey & Victoria//Wedding Save the Date//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'DTSTART:20270725T120000Z',
      'DTEND:20270726T000000Z',
      'SUMMARY:Jeffrey & Victoria\'s Wedding',
      'DESCRIPTION:Save the Date! Jeffrey & Victoria are getting married.\\nMore details to follow.',
      'STATUS:CONFIRMED',
      'TRANSP:OPAQUE',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    document.getElementById('btn-apple').href = URL.createObjectURL(blob);
  })();
</script>

</body>
</html>
