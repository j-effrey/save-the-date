<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date — Jeffrey &amp; Victoria</title>
</head>
<body style="margin:0;padding:52px 20px;background:#F5EAD7;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;">

<table role="presentation" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;margin:0 auto;background:#FFFFFC;border-radius:2px;overflow:hidden;box-shadow:0 20px 60px rgba(180,120,80,0.09),0 2px 12px rgba(180,120,80,0.05);">
  <tr>
    <td style="padding:0;line-height:0;">
      <img src="engagement.JPG" alt="Jeffrey and Victoria at Bethesda Terrace" style="width:100%;max-width:560px;height:auto;display:block;">
    </td>
  </tr>
  <tr>
    <td style="padding:46px 52px 50px;text-align:center;">

      <!-- Ornament -->
      <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;margin-bottom:28px;">
        <tr>
          <td style="height:1px;background:linear-gradient(to right,transparent,#E09384);opacity:0.28;"></td>
          <td style="padding:0 14px;white-space:nowrap;color:#E09384;opacity:0.55;font-size:11px;letter-spacing:0.30em;">
            <svg width="9" height="9" viewBox="0 0 10 10" style="display:inline-block;vertical-align:middle" fill="#E09384"><path d="M5 0L6.5 3.5L10 5L6.5 6.5L5 10L3.5 6.5L0 5L3.5 3.5Z"/></svg>&#8202;&#8202;<svg width="9" height="9" viewBox="0 0 10 10" style="display:inline-block;vertical-align:middle" fill="#E09384"><path d="M5 0L6.5 3.5L10 5L6.5 6.5L5 10L3.5 6.5L0 5L3.5 3.5Z"/></svg>&#8202;&#8202;<svg width="9" height="9" viewBox="0 0 10 10" style="display:inline-block;vertical-align:middle" fill="#E09384"><path d="M5 0L6.5 3.5L10 5L6.5 6.5L5 10L3.5 6.5L0 5L3.5 3.5Z"/></svg>
          </td>
          <td style="height:1px;background:linear-gradient(to left,transparent,#E09384);opacity:0.28;"></td>
        </tr>
      </table>

      <!-- Names -->
      <h1 style="margin:0 0 4px;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-weight:400;font-size:36px;color:#2c1e14;letter-spacing:0.04em;line-height:1.12;">
        Jeffrey <span style="color:#F5AA71;font-style:italic;">&amp;</span> Victoria
      </h1>

      <!-- Rule -->
      <div style="width:36px;height:1px;background:#E09384;opacity:0.30;margin:18px auto;"></div>

      <!-- Save the Date label -->
      <p style="margin:0 0 8px;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:11px;letter-spacing:0.20em;text-transform:uppercase;color:#E09384;">Save the Date</p>

      <!-- Date -->
      <p style="margin:0 0 28px;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-weight:300;font-size:18px;color:#7a6050;font-style:italic;line-height:1.65;">
        We're getting married!
        <span style="display:block;font-style:normal;color:#F5AA71;font-size:15px;line-height:2;opacity:0.65;">
          <svg width="9" height="9" viewBox="0 0 10 10" style="display:inline-block;vertical-align:middle" fill="#F5AA71"><path d="M5 0L6.5 3.5L10 5L6.5 6.5L5 10L3.5 6.5L0 5L3.5 3.5Z"/></svg>
        </span>
        <strong style="display:block;font-style:normal;font-weight:400;font-size:1.05em;color:#2c1e14;letter-spacing:0.04em;margin-top:2px;">Sunday, July 25th, 2027</strong>
      </p>

      <!-- CTA Button -->
      <a href="https://j-effrey.github.io/save-the-date/" target="_blank" rel="noopener"
         style="display:inline-block;background:#E09384;color:#fff;text-decoration:none;font-family:&quot;Palatino Linotype&quot;,Palatino,&quot;Book Antiqua&quot;,serif;font-size:10px;font-weight:400;letter-spacing:0.18em;text-transform:uppercase;padding:12px 30px;border-radius:1px;margin-bottom:18px;">
        Click here to open!
      </a>

      <!-- Cal label -->
      <p style="margin:0 0 10px;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-style:italic;font-size:10.5px;letter-spacing:0.12em;color:#a89080;">Add to your calendar</p>

      <!-- Cal buttons -->
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
        <tr>
          <td style="padding:0 3.5px;">
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Jeffrey+%26+Victoria%27s+Wedding&dates=20270725T120000Z%2F20270726T000000Z&details=Save+the+Date%21+Jeffrey+%26+Victoria+are+getting+married.+More+details+to+follow."
               target="_blank" rel="noopener"
               style="display:inline-block;border:1px solid rgba(44,30,20,0.11);color:#7a6050;text-decoration:none;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:11px;letter-spacing:0.06em;padding:8px 14px;">
              Google Calendar
            </a>
          </td>
          <td style="padding:0 3.5px;">
            <a href="https://outlook.live.com/calendar/0/deeplink/compose?subject=Jeffrey+%26+Victoria%27s+Wedding&startdt=2027-07-25T12%3A00%3A00&enddt=2027-07-26T00%3A00%3A00&body=Save+the+Date%21&path=%2Fcalendar%2Faction%2Fcompose&rru=addevent"
               target="_blank" rel="noopener"
               style="display:inline-block;border:1px solid rgba(44,30,20,0.11);color:#7a6050;text-decoration:none;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:11px;letter-spacing:0.06em;padding:8px 14px;">
              Outlook
            </a>
          </td>
          <td style="padding:0 3.5px;">
            <a href="https://j-effrey.github.io/save-the-date/"
               target="_blank" rel="noopener"
               style="display:inline-block;border:1px solid rgba(44,30,20,0.11);color:#7a6050;text-decoration:none;font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-size:11px;letter-spacing:0.06em;padding:8px 14px;">
              Apple Calendar
            </a>
          </td>
        </tr>
      </table>

      <!-- Footer -->
      <p style="margin:34px 0 0;padding-top:24px;border-top:1px solid rgba(44,30,20,0.08);font-family:"Palatino Linotype",Palatino,"Book Antiqua",serif;font-style:italic;font-size:13px;color:#a89080;letter-spacing:0.03em;line-height:1.80;">
        Formal invitation and more details to follow.
      </p>

    </td>
  </tr>
</table>

</body>
</html>
